<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cruise Bingo">
<meta name="theme-color" content="#0b2545">
<title>Dream Cruise Bingo</title>
<style>
  :root{
    --navy:#0b2545; --deep:#13315c; --sea:#1d4e89;
    --gold:#e8b931; --cream:#fdf6e3; --red:#c8323c; --ink:#0b2545;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    min-height:100vh;
    padding:max(16px,env(safe-area-inset-top)) 12px max(20px,env(safe-area-inset-bottom));
    background:linear-gradient(180deg,var(--navy) 0%,var(--deep) 55%,var(--sea) 100%);
    background-attachment:fixed;
    color:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;
  }
  .wrap{max-width:520px;margin:0 auto}
  header{text-align:center;margin:4px 0 12px}
  h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:1.75rem;color:var(--gold);letter-spacing:.02em}
  .sub{font-size:.85rem;opacity:.8;margin-top:2px}
  .letters,.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
  .letters{padding:0 5px;margin-bottom:4px}
  .letters div{text-align:center;font-family:Georgia,serif;font-weight:700;font-size:1.5rem;color:var(--gold)}
  .grid{background:var(--gold);padding:5px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .cell{
    aspect-ratio:1/1;border:0;border-radius:7px;margin:0;
    background:var(--cream);color:var(--ink);
    font:600 clamp(9.5px,2.75vw,13px)/1.15 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:3px;display:flex;align-items:center;justify-content:center;text-align:center;
    position:relative;overflow:hidden;cursor:pointer;
    word-break:break-word;hyphens:auto;-webkit-hyphens:auto;
    transition:background .15s,color .15s,transform .08s;
  }
  .cell:active{transform:scale(.95)}
  .cell span{position:relative;z-index:1}
  .cell.marked{background:var(--red);color:#fff}
  .cell.marked::after{
    content:"";position:absolute;inset:10%;
    border:3px solid rgba(255,255,255,.5);border-radius:50%;
  }
  .cell.free{background:var(--navy);color:var(--gold);font-family:Georgia,serif;font-style:italic}
  .cell.free::after{border-color:rgba(232,185,49,.6)}
  .cell.free small{display:block;font-style:normal;font-family:-apple-system,sans-serif;font-size:.75em;opacity:.8;margin-top:2px;letter-spacing:.08em}
  .cell.win{box-shadow:inset 0 0 0 3px var(--gold)}
  .status{text-align:center;margin:14px 0 4px;font-size:.95rem}
  .status b{color:var(--gold)}
  .warn{display:none;text-align:center;font-size:.8rem;background:rgba(200,50,60,.25);border:1px solid rgba(200,50,60,.6);border-radius:8px;padding:8px;margin-top:10px}
  .actions{display:flex;gap:10px;justify-content:center;margin-top:14px}
  .actions button{
    flex:1;max-width:180px;padding:12px 10px;border-radius:10px;border:1px solid rgba(232,185,49,.6);
    background:rgba(255,255,255,.06);color:var(--cream);font:600 .95rem -apple-system,sans-serif;cursor:pointer;
  }
  .actions button:active{background:rgba(232,185,49,.2)}
  .banner{
    position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);
    background:var(--gold);color:var(--navy);font:800 2.6rem Georgia,serif;
    padding:18px 34px;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.45);
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  }
  .banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Dream Cruise Bingo</h1>
    <div class="sub">Tap a square when you spot it</div>
  </header>

  <div class="letters"><div>B</div><div>I</div><div>N</div><div>G</div><div>O</div></div>
  <div class="grid" id="grid"></div>

  <div class="status" id="status"></div>
  <div class="warn" id="warn">Progress can't be saved in this view. Open the file in Safari (or host it) so your marks stick.</div>

  <div class="actions">
    <button id="clearBtn">Clear marks</button>
    <button id="newBtn">New card</button>
  </div>
</div>
<div class="banner" id="banner">BINGO!</div>

<script>
(function(){
  var SQUARES = [
    "Kid-free Disney adults",
    "Questionable outfit",
    "Pineapple",
    "Angry over nothing",
    "Honeymooners",
    "Bachelorette party",
    "Magnet-covered door",
    "Giant fish extender",
    "Family name sign",
    "Reunion shirts",
    "Other cruise line shirt",
    "Towel-saved chairs",
    "Elevator one floor",
    "Adult crying",
    "Kid crying at character",
    "Sunburned sleeper",
    "iPad filmer",
    "Buffet sprinter",
    "\u201CNot like Disney World\u201D",
    "Dumb crew question",
    "Price complainer",
    "Pirate Night Jack Sparrow",
    "Ears with formal wear",
    "Sunglasses at dinner"
  ];
  var FREE = "Hidden Mickey";
  var CENTER = 12;
  var KEY = "dream-cruise-bingo-v1";

  var canSave = true;
  function load(){
    try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; }
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); canSave = true; }
    catch(e){ canSave = false; }
    document.getElementById("warn").style.display = canSave ? "none" : "block";
  }

  function shuffle(a){
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function newState(){
    var s = shuffle(SQUARES);
    var cells = s.slice(0, CENTER).concat([FREE], s.slice(CENTER));
    var marked = []; for (var i = 0; i < 25; i++) marked.push(false);
    marked[CENTER] = true;
    return { cells: cells, marked: marked };
  }
  function valid(s){
    if (!s || !Array.isArray(s.cells) || !Array.isArray(s.marked)) return false;
    if (s.cells.length !== 25 || s.marked.length !== 25 || s.cells[CENTER] !== FREE) return false;
    var a = s.cells.filter(function(c){ return c !== FREE; }).slice().sort().join("|");
    var b = SQUARES.slice().sort().join("|");
    return a === b;
  }

  var LINES = [];
  for (var r = 0; r < 5; r++){ var row = []; for (var c = 0; c < 5; c++) row.push(r*5+c); LINES.push(row); }
  for (var c2 = 0; c2 < 5; c2++){ var col = []; for (var r2 = 0; r2 < 5; r2++) col.push(r2*5+c2); LINES.push(col); }
  LINES.push([0,6,12,18,24]); LINES.push([4,8,12,16,20]);

  function winners(){
    var w = {}, n = 0;
    LINES.forEach(function(l){
      if (l.every(function(i){ return state.marked[i]; })){ n++; l.forEach(function(i){ w[i] = true; }); }
    });
    return { n: n, w: w };
  }

  var state = load();
  if (!valid(state)) state = newState();
  save();
  var lastN = winners().n;

  var grid = document.getElementById("grid");
  var statusEl = document.getElementById("status");
  var banner = document.getElementById("banner");
  var bannerTimer = null;

  function celebrate(){
    banner.textContent = "BINGO!";
    banner.classList.add("show");
    if (navigator.vibrate) { try { navigator.vibrate([60,40,120]); } catch(e){} }
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(function(){ banner.classList.remove("show"); }, 1600);
  }

  function render(){
    var res = winners();
    grid.innerHTML = "";
    state.cells.forEach(function(text, i){
      var b = document.createElement("button");
      b.className = "cell" + (state.marked[i] ? " marked" : "") + (i === CENTER ? " free" : "") + (res.w[i] ? " win" : "");
      b.setAttribute("aria-pressed", state.marked[i] ? "true" : "false");
      if (i === CENTER){
        b.innerHTML = "<span>" + text + "<small>FREE</small></span>";
      } else {
        var s = document.createElement("span"); s.textContent = text; b.appendChild(s);
        b.addEventListener("click", function(){ toggle(i); });
      }
      grid.appendChild(b);
    });
    var count = state.marked.filter(Boolean).length - 1;
    statusEl.innerHTML = "<b>" + count + "</b> of 24 spotted" +
      (res.n ? " \u00B7 <b>" + res.n + " bingo" + (res.n > 1 ? "s" : "") + "</b>" : "");
  }

  function toggle(i){
    state.marked[i] = !state.marked[i];
    save();
    var n = winners().n;
    if (n > lastN) celebrate();
    lastN = n;
    render();
  }

  document.getElementById("clearBtn").addEventListener("click", function(){
    if (!confirm("Clear all marks on this card?")) return;
    for (var i = 0; i < 25; i++) state.marked[i] = (i === CENTER);
    lastN = 0; save(); render();
  });
  document.getElementById("newBtn").addEventListener("click", function(){
    if (!confirm("Shuffle a new card? This clears your marks.")) return;
    state = newState(); lastN = 0; save(); render();
  });

  render();
})();
</script>
</body>
</html>

</body></html>
